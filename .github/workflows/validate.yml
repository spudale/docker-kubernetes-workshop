name: Validate workshop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sample-app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sample-app/requirements.txt pytest

      - name: Run application tests
        run: python -m pytest sample-app/tests

      - name: Build Docker image
        run: docker build -t docker-ml-api:validation sample-app
